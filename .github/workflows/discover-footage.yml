name: Discover footage candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - run: python tools/discover_footage.py data/footage_queries.txt out/discovery
      - name: Push results to scratch branch
        run: |
          git config user.email "bot@example.com"; git config user.name "bot"
          git checkout --orphan scratch
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p discovery && cp out/discovery/* discovery/
          git add discovery && git commit -qm "footage discovery" && git push -f origin scratch
