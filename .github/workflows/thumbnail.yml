name: Build Thumbnail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libraqm0 imagemagick
          pip install pillow numpy
      - name: Download latest video from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'syria_revolution.mp4' --output video.mp4 --clobber
      - name: Make thumbnail
        run: python src/thumbnail.py video.mp4 out
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: out/thumbnail.*
