name: Build Syria Revolution Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "assets/**", "tools/**", ".github/workflows/build-video.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + libraqm (Arabic text shaping)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libharfbuzz0b libcairo2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download stickman drawing engine (vallahrich/stickman-mcp, MIT)
        run: |
          git clone https://github.com/vallahrich/stickman-mcp.git engine
          cd engine && git checkout ea1b1c35cce1bac273eb3cd12b55f670707c4de9
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @types/node
          npx tsc -p tsconfig.json || true
          test -f dist/index.js

      - name: Draw stickman motion clips with the engine
        run: node tools/make_clips.mjs engine build_tmp/clips

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check Arabic shaping is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'raqm missing'; print('raqm OK')"

      - name: Build video (TTS + map frames + mix)
        run: python src/build.py --out out/syria_revolution.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: syria-revolution-video
          path: out/syria_revolution.mp4
          retention-days: 30

      - name: Upload credits
        uses: actions/upload-artifact@v4
        with:
          name: footage-credits
          path: out/credits.json
        continue-on-error: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-$(date +%Y%m%d-%H%M%S)"
          python - <<'PY' > notes.md
          import json, os
          print("فيديو مولّد آليًا: تعليق صوتي + خرائط + رجل العصا (محرك stickman-mcp) + لقطات حقيقية مرخّصة من Wikimedia Commons.\n")
          print("## مصادر اللقطات")
          p = "out/credits.json"
          if os.path.exists(p):
              for c in json.load(open(p, encoding="utf-8")):
                  print(f"- {c['caption']}: {c['artist']} ({c['license']}) {c['page']}")
          PY
          gh release create "$TAG" out/syria_revolution.mp4 out/credits.json \
            --title "الثورة السورية - فيديو ستيكمان ($TAG)" --notes-file notes.md
