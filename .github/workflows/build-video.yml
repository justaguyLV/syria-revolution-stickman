name: Build Syria Revolution Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "assets/**", "tools/**", "requirements.txt", ".github/workflows/build-video.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + libraqm (Arabic text shaping)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libharfbuzz0b libcairo2

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check Arabic shaping is available
        run: python -c "from PIL import features; assert features.check('raqm'), 'raqm missing'; print('raqm OK')"

      - name: Fetch real terrain (AWS Terrarium) + admin boundaries (geoBoundaries)
        run: python tools/fetch_geo.py build_tmp/geo

      - name: Build video (TTS + crowd chants + sound effects + map frames + mix)
        run: python src/build.py --out out/syria_revolution.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: syria-revolution-video
          path: out/syria_revolution.mp4
          retention-days: 30

      - name: Upload credits
        uses: actions/upload-artifact@v4
        with:
          name: footage-credits
          path: out/credits.json
        continue-on-error: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-$(date +%Y%m%d-%H%M%S)"
          python - <<'PY' > notes.md
          import json, os
          print("فيديو مولّد آليًا: تعليق صوتي + خرائط تضاريس حقيقية + ستيكمان مرسوم بهيكل عظمي كامل + مؤثرات صوتية (رصاص، قصف، طائرات، هتافات) + لقطات حقيقية مرخّصة من Wikimedia Commons.\n")
          print("## مصادر اللقطات")
          p = "out/credits.json"
          if os.path.exists(p):
              for c in json.load(open(p, encoding="utf-8")):
                  print(f"- {c['caption']}: {c['artist']} ({c['license']}) {c['page']}")
          PY
          gh release create "$TAG" out/syria_revolution.mp4 out/credits.json \
            --title "الثورة السورية - فيديو ستيكمان ($TAG)" --notes-file notes.md
